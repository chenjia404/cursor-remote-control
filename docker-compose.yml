services:
  cursor-remote-control:
    build: .
    restart: unless-stopped
    ports:
      - "20267:20267"
    env_file:
      - path: .env
        format: raw
    environment:
      HOST: 0.0.0.0
      PORT: 20267
      PROJECT_ROOTS: /workspace/d-code;/workspace/c-code
      DATA_DIR: /app/data
      COOKIE_SECURE: "true"
    volumes:
      - ./data:/app/data
      - "D:\\code:/workspace/d-code"
      - "C:\\code:/workspace/c-code"
